<style>

.cl{display:flex;align-items:center;gap:1rem;padding:1.2rem 1.5rem;background:var(--bg2);border:1px solid rgba(124,106,239,.08);border-radius:12px;text-decoration:none;color:var(--t1);transition:border-color .3s,transform .3s}
.cl:hover{border-color:var(--ac);transform:translateX(8px)}
.cli{width:40px;height:40px;border-radius:10px;background:rgba(124,106,239,.1);display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:1.1rem;flex-shrink:0}
.cll{font-size:.75rem;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.clv{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:1rem}

footer{padding:3rem;border-top:1px solid rgba(124,106,239,.08);display:flex;justify-content:space-between;align-items:center;color:var(--t3);font-size:.8rem;position:relative;z-index:2}

@media(max-width:768px){
  body{cursor:auto}.cur,.spot{display:none}nav{padding:1rem 1.5rem}.nl{display:none}.mt{display:flex}
  .nl.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--bg);padding:2rem 1.5rem;border-bottom:1px solid rgba(124,106,239,.1)}
  .hero{padding:0 1.5rem}.hero h1{letter-spacing:-1px}.hs{width:100%;opacity:.5}.hsh{left:1.5rem}
  section{padding:4rem 1.5rem}.ag{grid-template-columns:1fr;gap:2rem}.as{position:relative;bottom:0;right:0;margin-top:1rem}
  .pfi{grid-template-columns:1fr}.pf .pi2{min-height:200px}.pg{grid-template-columns:1fr}
  .pc:nth-child(even){transform:none}.pc:nth-child(even):hover{transform:translateY(-8px)}
  .rg{grid-template-columns:1fr}footer{flex-direction:column;gap:1rem;text-align:center}
  .carousel-btn{opacity:1}
}
</style>

<div class="cur" id="cur"></div>
<div class="spot" id="spot"></div>

<nav>
  <a href="#" class="logo" id="navLogo"></a>
  <ul class="nl" id="navLinks">
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#research">Research</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <button class="mt" onclick="document.getElementById('navLinks').classList.toggle('open')">
    <span></span><span></span><span></span>
  </button>
</nav>

<section class="hero">
  <div class="hs"><div class="sh s1"></div><div class="sh s2"></div><div class="sh s3"></div></div>
  <div class="hero-c" id="heroC"></div>
  <div class="hsh"><div class="slx"></div><span>Scroll</span></div>
</section>

<section id="about"><div class="rev" id="aboutC"></div></section>
<section id="skills"><div class="rev" id="skillsC"></div></section>
<section id="projects"><div class="rev" id="projectsC"></div></section>
<section id="research"><div class="rev" id="researchC"></div></section>
<section id="contact"><div class="rev" id="contactC"></div></section>
<footer id="footerC"></footer>

<script>
const C = CONFIG;

// NAV
document.getElementById('navLogo').innerHTML = C.logoFirst+'<span>'+C.logoAccent+'</span>';
document.title = C.name+' | Portfolio';

// HERO
const hl = C.hero.headlines.map((l,i)=>{
  const c=i===1?'hla scr':'scr';
  return '<span class="'+c+'" data-text="'+l+'">'+l+'</span>'+(i<C.hero.headlines.length-1?'<br>':'');
}).join('');
let hb='<a href="'+C.hero.buttons.primary.link+'" class="bp">'+C.hero.buttons.primary.text+'</a>';
hb+='<a href="'+C.hero.buttons.secondary.link+'" class="bo">'+C.hero.buttons.secondary.text+'</a>';
if(C.hero.buttons.resume) hb+='<a href="'+C.resumeFile+'" download class="br">Download CV ↓</a>';
document.getElementById('heroC').innerHTML='<div class="htag">'+C.hero.tag+'</div><h1>'+hl+'</h1><p>'+C.hero.description+'</p><div class="hcta">'+hb+'</div>';

// ABOUT — with photo carousel
let photoHTML='';
if(C.photos.length > 0) {
  const slides = C.photos.map(p=>'<div class="carousel-slide"><img src="'+p+'" alt="Photo" draggable="false"></div>').join('');
  const dots = C.photos.map((_,i)=>'<button class="carousel-dot'+(i===0?' active':'')+'" data-i="'+i+'"></button>').join('');
  const counter = '<div class="carousel-counter"><span id="cSlide">1</span>/'+C.photos.length+'</div>';
  const arrows = C.photos.length > 1 ? '<button class="carousel-btn carousel-prev" id="cPrev">‹</button><button class="carousel-btn carousel-next" id="cNext">›</button>' : '';
  photoHTML='<div class="carousel" id="carousel">'+
    '<div class="carousel-track" id="cTrack">'+slides+'</div>'+
    arrows + counter +
    (C.photos.length>1?'<div class="carousel-dots" id="cDots">'+dots+'</div>':'')+
    '</div>';
} else {
  photoHTML='<div class="aip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Add photos to config</span></div>';
}
const sts=C.about.stats.map(s=>'<div class="si"><h3>'+s.number+'</h3><p>'+s.label+'</p></div>').join('');
const prs=C.about.paragraphs.map(p=>'<p>'+p+'</p>').join('');
const bds=C.about.badges.map(b=>'<span class="badge badge-'+b.color+'">'+b.icon+' '+b.text+'</span>').join('');
document.getElementById('aboutC').innerHTML=
  '<div class="sl2">About Me</div><div class="ag"><div class="aiw">'+photoHTML+'<div class="as">'+sts+'</div></div><div class="at"><h2 class="st">'+C.about.title.replace(/\n/g,'<br>')+'</h2>'+prs+'<div class="brow">'+bds+'</div></div></div>';

// Carousel logic
if(C.photos.length > 1) {
  const track = document.getElementById('cTrack');
  const dots = document.querySelectorAll('.carousel-dot');
  const counter = document.getElementById('cSlide');
  let cur2 = 0, startX = 0, dx = 0, dragging = false, autoTimer;

  function goTo(i) {
    cur2 = ((i % C.photos.length) + C.photos.length) % C.photos.length;
    track.style.transform = 'translateX(-'+cur2*100+'%)';
    dots.forEach((d,j)=>d.classList.toggle('active',j===cur2));
    counter.textContent = cur2+1;
  }

  function startAuto() { autoTimer = setInterval(()=>goTo(cur2+1), C.photoAutoSlideSeconds*1000); }
  function stopAuto() { clearInterval(autoTimer); }

  document.getElementById('cPrev').onclick = ()=>{ stopAuto(); goTo(cur2-1); startAuto(); };
  document.getElementById('cNext').onclick = ()=>{ stopAuto(); goTo(cur2+1); startAuto(); };
  dots.forEach(d=>d.onclick=()=>{ stopAuto(); goTo(+d.dataset.i); startAuto(); });

  // Touch / mouse drag
  track.addEventListener('pointerdown', e=>{ dragging=true; startX=e.clientX; track.classList.add('dragging'); stopAuto(); });
  track.addEventListener('pointermove', e=>{ if(!dragging)return; dx=e.clientX-startX; track.style.transform='translateX(calc(-'+cur2*100+'% + '+dx+'px))'; });
  track.addEventListener('pointerup', ()=>{
    if(!dragging)return; dragging=false; track.classList.remove('dragging');
    if(Math.abs(dx)>50) goTo(cur2+(dx<0?1:-1)); else goTo(cur2);
    dx=0; startAuto();
  });
  track.addEventListener('pointerleave', ()=>{ if(dragging){dragging=false;track.classList.remove('dragging');goTo(cur2);dx=0;startAuto();} });

  startAuto();
}

// SKILLS
let skh='';
C.skills.categories.forEach(c=>{
  skh+='<div class="skcat">'+c.label+'</div>';
  c.items.forEach(s=>{skh+='<div class="pill"><span>'+s+'</span></div>';});
});
document.getElementById('skillsC').innerHTML='<div class="sl2">Tech Stack</div><h2 class="st">'+C.skills.title.replace(/\n/g,'<br>')+'</h2><div class="skc">'+skh+'</div>';

// PROJECTS — renders image if available, icon if not
function mkImg(proj) {
  if(proj.image) return '<img src="'+proj.image+'" alt="'+proj.title+'">';
  return '<span class="picon">'+(proj.icon||'🔧')+'</span>';
}
const f=C.projects.featured;
let ch='';
C.projects.cards.forEach(c=>{
  const ct=c.tags.map(t=>'<span>'+t+'</span>').join('');
  const cl3=c.links.map(l=>'<a href="'+l.url+'" target="_blank" rel="noopener">'+l.label+'</a>').join('');
  ch+='<div class="pc"><div class="pi2">'+mkImg(c)+'</div><div class="pin"><div class="pty">'+c.type+'</div><h3>'+c.title+'</h3><p>'+c.description+'</p><div class="ptags">'+ct+'</div><div class="plinks">'+cl3+'</div></div></div>';
});
const ft=f.tags.map(t=>'<span>'+t+'</span>').join('');
const fl2=f.links.map(l=>'<a href="'+l.url+'" target="_blank" rel="noopener">'+l.label+'</a>').join('');
document.getElementById('projectsC').innerHTML=
  '<div class="sl2">'+C.projects.sectionLabel+'</div><h2 class="st">'+C.projects.title+'</h2><div class="pf"><div class="pfi"><div class="pi2">'+mkImg(f)+'</div><div class="pin"><div class="pty">'+f.type+'</div><h3>'+f.title+'</h3><p>'+f.description+'</p><div class="ptags">'+ft+'</div><div class="plinks">'+fl2+'</div></div></div></div><div class="pg">'+ch+'</div>';

// RESEARCH
let rh='';
C.research.papers.forEach(p=>{
  rh+='<a href="'+p.link+'" target="_blank" rel="noopener" class="rc"><div class="rty '+p.color+'">'+p.type+'</div><h3>'+p.title+'</h3><p>'+p.description+'</p><span class="rl">'+p.linkText+'</span></a>';
});
document.getElementById('researchC').innerHTML='<div class="sl2">Research</div><h2 class="st">'+C.research.title+'</h2><div class="rg">'+rh+'</div>';

// CONTACT
let clh='';
C.contact.links.forEach(l=>{
  clh+='<a href="'+l.url+'" target="_blank" rel="noopener" class="cl"><div class="cli">'+l.icon+'</div><div><div class="cll">'+l.label+'</div><div class="clv">'+l.value+'</div></div></a>';
});
document.getElementById('contactC').innerHTML='<div class="sl2">Contact</div><div class="cw"><h2 class="st">'+C.contact.title.replace(/\n/g,'<br>')+'</h2><p>'+C.contact.description+'</p><div class="cls">'+clh+'</div></div>';

// FOOTER
document.getElementById('footerC').innerHTML='<span>&copy; '+new Date().getFullYear()+' '+C.name+'. '+C.footer.left+'</span><span>'+C.footer.right+'</span>';

// ══ ANIMATIONS ══
const cur3=document.getElementById('cur'),spot2=document.getElementById('spot');
let mx=0,my=0,cx3=0,cy3=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;spot2.style.left=e.clientX+'px';spot2.style.top=e.clientY+'px';});
(function ac(){cx3+=(mx-cx3)*.15;cy3+=(my-cy3)*.15;cur3.style.left=cx3-6+'px';cur3.style.top=cy3-6+'px';requestAnimationFrame(ac);})();
document.querySelectorAll('a,button,.pill,.pc,.pf,.rc,.cl').forEach(el=>{el.addEventListener('mouseenter',()=>cur3.classList.add('hover'));el.addEventListener('mouseleave',()=>cur3.classList.remove('hover'));});

class TS{constructor(el){this.el=el;this.ch='!<>-_\\/[]{}—=+*^?#________';this.update=this.update.bind(this);}
setText(t){const o=this.el.innerText,l=Math.max(o.length,t.length);const p=new Promise(r=>this.resolve=r);this.queue=[];for(let i=0;i<l;i++){const s=Math.floor(Math.random()*40);this.queue.push({from:o[i]||'',to:t[i]||'',start:s,end:s+Math.floor(Math.random()*40)});}cancelAnimationFrame(this.fr);this.frame=0;this.update();return p;}
update(){let o='',c=0;for(let i=0;i<this.queue.length;i++){let{from,to,start,end,char}=this.queue[i];if(this.frame>=end){c++;o+=to;}else if(this.frame>=start){if(!char||Math.random()<.28){char=this.ch[Math.floor(Math.random()*this.ch.length)];this.queue[i].char=char;}o+='<span style="color:var(--ac);opacity:.7">'+char+'</span>';}else o+=from;}this.el.innerHTML=o;if(c===this.queue.length)this.resolve();else{this.fr=requestAnimationFrame(this.update);this.frame++;}}}
document.querySelectorAll('.scr').forEach((el,i)=>{const fx=new TS(el);setTimeout(()=>fx.setText(el.dataset.text),300+i*400);});
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('active');});},{threshold:.15});
document.querySelectorAll('.rev').forEach(el=>obs.observe(el));
document.querySelectorAll('.nl a').forEach(a=>{a.addEventListener('click',()=>document.getElementById('navLinks').classList.remove('open'));});
</script>
</body>
</html>
